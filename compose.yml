services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "${PUBLIC_PB_PORT:-8090}:8090"
    volumes:
      - pb_data:/app/pb_data:z
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  pb_data:
